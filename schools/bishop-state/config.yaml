    percent_adjunct: 0.55
    avg_class_size: 22
    developmental_ed_model: "corequisite"
    lms: "Canvas"

  pipeline:
    feeder_high_schools:
      - name: "Williamson High School"
        percent_of_enrollment: 0.12
