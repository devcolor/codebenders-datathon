    percent_working_over_20hrs: 0.48
    percent_single_parents: 0.18
    percent_caregiver_responsibilities: 0.25
    childcare_waitlist: true
    student_orgs: 15
    athletics: false
    housing_insecurity_rate: 0.14
    food_insecurity_rate: 0.31

  health:
